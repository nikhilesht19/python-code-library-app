---
services:
  db:
    container_name: db
    image: nikhilesht19/databaseimage:v1
    ports:
      - "3306:3306"
    volumes:
      - mydata:/var/lib/mysql/
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M

  auth_service:
    container_name: auth_service
    image: nikhilesht19/authimage:v1
    ports:
      - "5001:5001"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  book_service:
    container_name: book_service
    image: nikhilesht19/bookimage:v1
    ports:
      - "5002:5002"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  borrow_service:
    container_name: borrow_service
    image: nikhilesht19/borrowimage:v1
    ports:
      - "5003:5003"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
  frontend:
    container_name: frontend
    image: nikhilesht19/frontendimage:v1
    ports:
      - "5000:5000"
    networks:
      - myapp
    deploy:
      resources:
        reservations:
          cpus: "0.25"
          memory: 100M
        limits:
          cpus: "0.5"
          memory: 200M
networks:
  myapp:
    driver: overlay
volumes:
  mydata:
